<!doctype html>
<html><head><meta charset="utf-8"><title>Lux</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px}textarea{width:100%;height:160px}button{margin:8px 4px 8px 0;padding:8px 14px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>Lux</h1><p>Submit a coding task and monitor its job.</p>
<input id="key" type="password" placeholder="Lux API key" style="width:100%;padding:8px">
<textarea id="prompt" placeholder="Describe the coding task"></textarea>
<input id="project" value="default" placeholder="Project name" style="padding:8px">
<br><button onclick="submitJob()">Start job</button><button onclick="cancelJob()">Cancel</button>
<pre id="status">No job</pre>
<script>
let id=null;
const headers=()=>({'Content-Type':'application/json','X-Lux-Key':document.getElementById('key').value});
async function submitJob(){const r=await fetch('/api/jobs',{method:'POST',headers:headers(),body:JSON.stringify({prompt:prompt.value,project_name:project.value})});const x=await r.json();id=x.id;status.textContent=JSON.stringify(x,null,2);poll();}
async function poll(){if(!id)return;const r=await fetch('/api/jobs/'+id,{headers:headers()});status.textContent=JSON.stringify(await r.json(),null,2);if(!/succeeded|failed|cancelled/.test(status.textContent))setTimeout(poll,2000);}
async function cancelJob(){if(id)await fetch('/api/jobs/'+id+'/cancel',{method:'POST',headers:headers()});}
</script></body></html>
