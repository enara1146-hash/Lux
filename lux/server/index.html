<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lux</title>
<style>
:root{--bg:#212121;--panel:#171717;--soft:#2f2f2f;--text:#ececec;--muted:#a0a0a0;--accent:#10a37f;--border:#3b3b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}.sidebar{width:260px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:14px}.brand{font-size:18px;font-weight:700;padding:8px 10px}.new{background:transparent;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left}.new:hover,.conversation:hover{background:var(--soft)}.conversation{padding:10px;border-radius:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;font-weight:600}.model{color:var(--muted);font-weight:400;margin-left:8px}.thread{flex:1;overflow:auto}.welcome{max-width:780px;margin:15vh auto 0;text-align:center}.welcome h1{font-size:30px;margin-bottom:8px}.welcome p{color:var(--muted)}.messages{max-width:820px;margin:0 auto;padding:28px 20px 160px}.message{display:flex;gap:14px;padding:22px 0;line-height:1.6}.avatar{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--accent);font-weight:700;flex:none}.message.user .avatar{background:#6b6b6b}.bubble{white-space:pre-wrap;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:6px}.composer-wrap{position:fixed;bottom:0;left:260px;right:0;background:linear-gradient(transparent,var(--bg) 28%);padding:35px 20px 22px}.composer{max-width:820px;margin:auto;background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:0 3px 20px #0004}.composer textarea{width:100%;background:transparent;border:0;outline:0;color:var(--text);resize:none;min-height:26px;max-height:160px;font:inherit}.composer-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.hint{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.secondary{background:transparent;color:var(--muted);padding:7px 10px;border-radius:7px}.secondary:hover{background:#444;color:var(--text)}.send{background:var(--text);color:#222;border-radius:8px;padding:8px 13px;font-weight:600}.send:disabled{opacity:.45;cursor:not-allowed}.status{max-width:820px;margin:0 auto;padding:8px 20px;color:var(--muted);font-size:12px}.error{color:#ff8e8e}.approval{background:#493d20;border:1px solid #806b30;padding:14px;border-radius:10px}.approval button{background:#d9b44a;color:#241d09;border-radius:7px;padding:7px 12px;margin:10px 8px 0 0}.artifact{display:inline-block;color:#72d6bd;margin:4px 8px 0 0}
@media(max-width:700px){.sidebar{display:none}.composer-wrap{left:0}.messages{padding-left:14px;padding-right:14px}.welcome{margin-top:20vh}.topbar{padding:0 16px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">✦ Lux</div>
  <button class="new" id="newChat">＋ New task</button>
  <div id="conversation" class="conversation">No active task</div>
  <div class="side-bottom">OpenAI-compatible coding agent<br>Powered by OpenHands<br><a href="/admin" style="color:#72d6bd">Admin settings →</a></div>
</aside>
<main class="main">
  <header class="topbar">Lux <span class="model" id="modelLabel">· ready</span></header>
  <section class="thread" id="thread">
    <div class="welcome" id="welcome"><h1>How can I help you build?</h1><p>Describe a coding task and Lux will work in an isolated project workspace.</p></div>
    <div class="messages" id="messages"></div>
  </section>
  <div class="status" id="status"></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Message Lux..." aria-label="Task prompt"></textarea>
      <input id="repository" placeholder="Optional GitHub repository URL" style="width:100%;margin:8px 0;padding:8px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text)"><div class="composer-row"><span class="hint">Enter to send · Shift+Enter for a new line</span><div class="actions"><button class="secondary" id="cancel" hidden>Stop</button><button class="send" id="send">↑</button></div></div>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);let jobId=null,pollTimer=null,assistantRow=null,stream=null;
const headers=()=>{const key=localStorage.getItem('lux-key')||'';return {'Content-Type':'application/json','X-Lux-Key':key,'Authorization':'Bearer '+key};};
function add(role,text,meta=''){ $('welcome').style.display='none'; const row=document.createElement('div');row.className='message '+role;row.innerHTML='<div class="avatar">'+(role==='user'?'You':'✦')+'</div><div><div class="bubble"></div><div class="meta"></div></div>';row.querySelector('.bubble').textContent=text;row.querySelector('.meta').textContent=meta;$('messages').appendChild(row);$('thread').scrollTop=$('thread').scrollHeight;return row}
function setStatus(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
function renderJob(x){$('conversation').textContent=x.id?'Task '+x.id.slice(0,8):'No active task';$('modelLabel').textContent='· '+(x.status||'ready');if(x.status==='failed'){setStatus(x.error||'The task failed.',true)}else if(x.status==='succeeded'){const v=x.verification;setStatus(v&&v.status!=='skipped'?'Completed · tests '+v.status:'Completed. Artifacts are ready.');loadArtifacts(x.id)}else if(x.status==='cancelled'){setStatus('Stopped.')}else{setStatus(x.status||'queued')}}
async function submit(){const text=$('prompt').value.trim();if(!text)return;localStorage.setItem('lux-key',localStorage.getItem('lux-key')||'');$('prompt').value='';$('send').disabled=true;add('user',text);setStatus('Starting task…');try{const r=await fetch('/api/jobs',{method:'POST',headers:headers(),body:JSON.stringify({prompt:text,project_name:'default',repository_url:document.getElementById('repository').value.trim()||null})});const x=await r.json();if(!r.ok)throw Error(x.detail||('Request failed: '+r.status));jobId=x.id;assistantRow=add('assistant','I’m working on it…','Job '+x.id.slice(0,8));$('cancel').hidden=false;renderJob(x);streamJob()}catch(e){setStatus(e.message,true)}finally{$('send').disabled=false}}
function streamJob(){
  if(!jobId)return;
  try{
    stream=new EventSource('/api/jobs/'+jobId+'/stream');
    stream.addEventListener('job',e=>{const x=JSON.parse(e.data);renderJob(x);});
    stream.addEventListener('token',e=>{
      const x=JSON.parse(e.data);
      if(assistantRow&&x.text){const bubble=assistantRow.querySelector('.bubble');if(bubble.textContent==='I’m working on it…')bubble.textContent='';bubble.textContent+=x.text;$('thread').scrollTop=$('thread').scrollHeight;}
    });
    stream.onerror=()=>{stream.close();pollTimer=setTimeout(poll,1000)};
  }catch(e){poll()}
}
async function poll(){if(!jobId)return;try{const r=await fetch('/api/jobs/'+jobId,{headers:headers()});const x=await r.json();if(!r.ok)throw Error(x.detail||('Polling failed: '+r.status));renderJob(x);if(!['succeeded','failed','cancelled'].includes(x.status))pollTimer=setTimeout(poll,2000);else $('cancel').hidden=true}catch(e){setStatus(e.message,true)}}
async function cancel(){if(!jobId)return;await fetch('/api/jobs/'+jobId+'/cancel',{method:'POST',headers:headers()});setStatus('Stopping…')}
async function loadArtifacts(id){const r=await fetch('/api/jobs/'+id+'/artifacts',{headers:headers()});if(!r.ok)return;const xs=await r.json();if(!xs.length)return;const row=add('assistant','Artifacts','');for(const x of xs){const a=document.createElement('a');a.className='artifact';a.href='/api/jobs/'+id+'/artifact?path='+encodeURIComponent(x.path);a.textContent=x.path;a.target='_blank';row.querySelector('.bubble').appendChild(a)}}
$('send').onclick=submit;$('cancel').onclick=cancel;$('newChat').onclick=()=>{if(pollTimer)clearTimeout(pollTimer);jobId=null;if(stream)stream.close();$('messages').innerHTML='';$('welcome').style.display='block';$('status').textContent='';$('modelLabel').textContent='· ready';$('conversation').textContent='No active task';$('cancel').hidden=true};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}};
$('prompt').oninput=()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,160)+'px'};
</script>
</body></html>
